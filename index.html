<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Яков Фельдман</title>
  <link rel="stylesheet" href="style.css?v=22">
</head>
<body class="cover-open">
  <div id="cover-screen" aria-hidden="false">
    <div class="shelf">
      <p class="cover-author">Яков Фельдман</p>
      <button type="button" class="shelf-book" data-volume="2005">
        <strong>Теория уровней и модель человека</strong>
        <span>2005</span>
      </button>
      <button type="button" class="shelf-book" data-volume="beach">
        <strong>Философ на пляже</strong>
        <span>2008</span>
      </button>
      <button type="button" class="shelf-book" data-volume="album">
        <strong>Альбом. Том 1. Инструментарий</strong>
        <span>2011</span>
      </button>
      <button type="button" class="shelf-book" data-volume="m678">
        <strong>М678</strong>
        <span>2012</span>
      </button>
      <button type="button" class="shelf-book" data-volume="anthro">
        <strong>Антропология для инопланетян</strong>
        <span>2023</span>
      </button>
      <button type="button" class="shelf-book" data-volume="later">
        <strong>Философ 20 лет спустя</strong>
        <span>2026</span>
      </button>
    </div>
  </div>

  <main id="main">
    <article id="reader">
      <button type="button" id="cover-home" title="К обложке" aria-label="К обложке">
        <span class="cover-home-title">Полка</span>
        <span class="cover-home-hint">книги</span>
      </button>
      <div class="page-nav">
        <button type="button" class="page-prev" title="Предыдущая глава" aria-label="Предыдущая глава">←</button>
        <p class="page-meta"></p>
        <button type="button" class="page-next" title="Следующая глава" aria-label="Следующая глава">→</button>
        <button type="button" id="toc-top" class="toc-btn" title="Оглавление" aria-label="К оглавлению">☰ Оглавление</button>
      </div>
      <h2 id="page-title"></h2>
      <div id="listen" hidden>
        <div class="listen-bar">
          <button type="button" id="listen-btn">Слушать</button>
          <div id="listen-parts"></div>
        </div>
        <div id="listen-host"></div>
      </div>
      <div id="content"></div>
      <div class="page-nav page-nav-bottom">
        <button type="button" class="page-prev" title="Предыдущая глава" aria-label="Предыдущая глава">←</button>
        <p class="page-meta"></p>
        <button type="button" class="page-next" title="Следующая глава" aria-label="Следующая глава">→</button>
        <button type="button" id="toc-bottom" class="toc-btn" title="Оглавление" aria-label="К оглавлению">☰ Оглавление</button>
      </div>
    </article>
  </main>
  <script src="app.js?v=25"></script>
</body>
</html>
